<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>總進度計劃 / Master Schedule — MIA Runway</title>
<style>
/* ===== 總進度計劃 Master Schedule Gantt (namespaced ms-) ===== */
:root{
  --ms-navy:#1F3A5F;--ms-blue:#2E6FB5;--ms-line:#e3eaf2;
  --ms-sans:-apple-system,"PingFang SC","Microsoft YaHei",Segoe UI,Roboto,Arial,sans-serif;
  --ms-w-ph:132px;--ms-w-seq:46px;--ms-w-wk:336px;--ms-w-dt:162px;
  --ms-l-seq:132px;--ms-l-wk:178px;--ms-l-dt:514px;
  --ms-rh:44px;--ms-bh:24px;
}
.ms-shell{background:#fff;border:1px solid var(--ms-line);border-radius:12px;overflow:hidden;
  font-family:var(--ms-sans);color:#1f2c3a;font-size:14px;}
.ms-shell *{box-sizing:border-box;}
.ms-shell:fullscreen{border-radius:0;border:none;}

/* ---------- toolbar ---------- */
.ms-tb1,.ms-tb2{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:11px 14px;}
.ms-tb1{border-bottom:1px solid var(--ms-line);}
.ms-tb2{border-bottom:1px solid var(--ms-line);background:#fafcfe;}
.ms-tabs{display:inline-flex;background:#eef2f6;border-radius:9px;padding:3px;}
.ms-tabs button{border:none;background:transparent;padding:8px 16px;border-radius:7px;cursor:pointer;
  font-size:13.5px;color:#33414f;font-family:var(--ms-sans);}
.ms-tabs button.on{background:var(--ms-blue);color:#fff;font-weight:600;box-shadow:0 1px 4px rgba(46,111,181,.35);}
.ms-grp{display:inline-flex;align-items:center;gap:6px;padding:0 4px;}
.ms-cap{font-size:11.5px;color:#8494a6;}
.ms-btn{border:1px solid #d5dfea;background:#fff;color:#2c3e52;border-radius:7px;padding:6px 11px;
  cursor:pointer;font-size:12.5px;font-family:var(--ms-sans);line-height:1.2;transition:.12s;}
.ms-btn:hover{background:#eef5fc;border-color:#a9c6e6;color:#1b4d80;}
.ms-btn.on{background:var(--ms-blue);border-color:var(--ms-blue);color:#fff;font-weight:600;}
.ms-btn.ico{font-size:15px;font-weight:700;padding:5px 11px;}
.ms-zlbl{font-size:12px;color:#5b6b7e;min-width:78px;text-align:center;font-variant-numeric:tabular-nums;}
.ms-sep{width:1px;height:22px;background:var(--ms-line);margin:0 2px;}
.ms-legend{display:flex;gap:7px;flex-wrap:wrap;align-items:center;}
.ms-legend .ms-lg{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:#3d4d5f;
  background:#fff;border:1px solid #e1e9f2;border-radius:20px;padding:3px 10px 3px 6px;cursor:pointer;transition:.12s;}
.ms-legend .ms-lg:hover{border-color:#a9c6e6;background:#f2f8ff;box-shadow:0 1px 4px rgba(20,40,70,.08);}
.ms-legend .ms-sw{width:12px;height:12px;border-radius:50%;display:inline-block;flex:0 0 12px;}
.ms-legend .ms-lg .ms-n{color:#93a1b1;font-size:10.5px;}
.ms-legend .ms-lg .ms-pn{font-weight:600;font-size:11.5px;}
.ms-legend .ms-lg .ms-pen{font-size:11.5px;font-weight:600;opacity:1;margin-left:5px;}

/* ---------- gantt frame ---------- */
.ms-gbox{overflow:auto;max-height:74vh;position:relative;background:#fff;}
.ms-shell:fullscreen .ms-gbox{max-height:calc(100vh - 168px);}
.ms-gstage{position:relative;}
.ms-overlay{position:absolute;pointer-events:none;z-index:0;}
.ms-overlay .ms-mb{position:absolute;top:0;bottom:0;background:#f7fafd;}
.ms-overlay .ms-ml{position:absolute;top:0;bottom:0;width:1px;background:#edf1f6;}
.ms-overlay .ms-yl{position:absolute;top:0;bottom:0;width:2px;background:#cfdbe8;}
.ms-overlay .ms-tdl{position:absolute;top:0;bottom:0;width:2px;background:#e2492f;z-index:2;}
.ms-overlay .ms-tdl span{position:absolute;top:3px;left:4px;font-size:10px;color:#e2492f;font-weight:700;
  white-space:nowrap;background:rgba(255,255,255,.86);padding:1px 4px;border-radius:3px;}

/* width/min-width/font-size are re-declared to neutralise the host page's bare
   `table{width:100%;min-width:920px;font-size:..}` rule when embedded. */
table.ms-gt{border-collapse:separate;border-spacing:0;table-layout:fixed;margin:0;
  width:auto;min-width:0;font-size:14px;}
/* fixed column widths -- MUST match the sticky left offsets and LEFT_W in JS */
#ms-c1{width:var(--ms-w-ph);}#ms-c2{width:var(--ms-w-seq);}
#ms-c3{width:var(--ms-w-wk);}#ms-c4{width:var(--ms-w-dt);}
.ms-gt th,.ms-gt td{padding:0;vertical-align:middle;border:none;}
.ms-gt thead th{position:sticky;top:0;background:#f4f8fc;border-bottom:2px solid #dbe5ef;
  font-size:11.5px;color:#5b6b7e;font-weight:600;text-align:center;height:56px;text-transform:none;letter-spacing:0;}
.ms-gt thead th.ms-c-ph{z-index:6;left:0;}
.ms-gt thead th.ms-c-seq{z-index:6;left:var(--ms-l-seq);}
.ms-gt thead th.ms-c-wk{z-index:6;left:var(--ms-l-wk);}
.ms-gt thead th.ms-c-dt{z-index:6;left:var(--ms-l-dt);}
.ms-gt thead th.ms-c-tl{z-index:4;padding:0;text-align:left;}
.ms-gt thead th.ms-c-ph,.ms-gt thead th.ms-c-seq,
.ms-gt thead th.ms-c-wk,.ms-gt thead th.ms-c-dt{position:sticky;}
.ms-gt thead th b{display:block;color:var(--ms-navy);font-size:12.5px;font-weight:700;}
.ms-gt thead th i{display:block;font-style:normal;font-size:12px;font-weight:600;color:var(--ms-navy);opacity:1;letter-spacing:0;}

/* neutralise a host page's zebra / row-hover striping (`tbody tr:nth-child(even)`)
   -- the timeline cell is transparent, so a tinted <tr> would bleed through. */
.ms-gt tbody tr{height:var(--ms-rh);background:transparent;}
.ms-gt tbody tr:nth-child(even){background:transparent;}
.ms-gt tbody tr:hover{background:transparent;}
.ms-gt tbody td.ms-c-ph,.ms-gt tbody td.ms-c-seq,
.ms-gt tbody td.ms-c-wk,.ms-gt tbody td.ms-c-dt{
  position:sticky;background:#fff;z-index:3;border-bottom:1px solid var(--ms-line);}
.ms-gt tbody td.ms-c-ph{left:0;z-index:4;color:#fff;text-align:center;padding:6px 7px;
  border-bottom:2px solid #fff;border-right:1px solid rgba(255,255,255,.35);}
.ms-gt tbody td.ms-c-ph .ms-pz{font-size:12.5px;font-weight:700;line-height:1.3;}
.ms-gt tbody td.ms-c-ph .ms-pe{font-size:11.5px;font-weight:600;line-height:1.3;opacity:1;margin-top:3px;}
.ms-gt tbody td.ms-c-seq{left:var(--ms-l-seq);text-align:center;color:#8a98a8;font-size:11.5px;
  border-right:1px solid #f1f5f9;}
.ms-gt tbody td.ms-c-wk{left:var(--ms-l-wk);padding:4px 10px;border-right:1px solid #f1f5f9;}
.ms-gt tbody td.ms-c-wk .ms-wz{font-size:13px;font-weight:600;color:#1f2c3a;line-height:1.3;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ms-gt tbody td.ms-c-wk .ms-we{font-size:12px;color:#1f2c3a;font-weight:600;line-height:1.3;margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ms-gt tbody td.ms-c-wk .ms-wr{font-size:10px;color:#a2723a;background:#fdf6e8;border-radius:3px;
  padding:2px 5px;margin-top:3px;line-height:1.35;}
.ms-gt.ms-rem tbody td.ms-c-wk .ms-wz,
.ms-gt.ms-rem tbody td.ms-c-wk .ms-we{white-space:normal;}
.ms-gt tbody td.ms-c-dt{left:var(--ms-l-dt);padding:4px 10px;text-align:right;border-right:1px solid #e6edf5;}
.ms-gt tbody td.ms-c-dt .ms-dd{font-size:11px;color:#46566a;font-variant-numeric:tabular-nums;}
.ms-gt tbody td.ms-c-dt .ms-de{font-size:11px;color:#8a98a8;font-variant-numeric:tabular-nums;margin-top:1px;}
.ms-gt tbody td.ms-c-tl{position:relative;background:transparent;border-bottom:1px solid var(--ms-line);}
.ms-gt tbody tr:hover td.ms-c-tl{background:rgba(46,111,181,.055);}
.ms-gt tbody tr:hover td.ms-c-wk{background:#f7fbff;}
.ms-gt tbody tr.ms-flash td.ms-c-wk,.ms-gt tbody tr.ms-flash td.ms-c-tl{background:#fff6d8;}

.ms-bar{position:absolute;top:50%;transform:translateY(-50%);height:var(--ms-bh);border-radius:5px;
  min-width:4px;z-index:2;box-shadow:0 1px 3px rgba(0,0,0,.2);cursor:default;transition:filter .12s;}
.ms-bar:hover{filter:brightness(1.1);box-shadow:0 2px 7px rgba(0,0,0,.28);}
.ms-bar .ms-bl{position:absolute;left:7px;top:50%;transform:translateY(-50%);color:#fff;font-size:10.5px;
  white-space:nowrap;pointer-events:none;text-shadow:0 1px 1px rgba(0,0,0,.3);font-variant-numeric:tabular-nums;}

.ms-ax{position:relative;}
.ms-ax .ms-yrow{display:flex;height:28px;border-bottom:1px solid #e3eaf2;}
.ms-ax .ms-yrow .ms-yc{flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-weight:700;
  color:var(--ms-navy);font-size:12.5px;border-right:2px solid #cfdbe8;background:#eef4fa;}
.ms-ax .ms-mrow{display:flex;height:27px;}
.ms-ax .ms-mrow .ms-mc{flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:10.5px;
  color:#6b7a8c;border-right:1px solid #e8eef5;overflow:hidden;white-space:nowrap;}
.ms-ax .ms-tt{position:absolute;top:0;bottom:0;width:2px;background:#e2492f;z-index:3;}
.ms-ax .ms-tt:after{content:"";position:absolute;top:-1px;left:-3px;width:8px;height:8px;border-radius:50%;
  background:#e2492f;}
.ms-top{display:flex;justify-content:flex-end;padding:9px 15px 0;}
.ms-upd{font-size:12.5px;color:#5b6b7e;font-weight:500;font-family:var(--ms-sans);}
.ms-upd b{color:var(--ms-navy);font-weight:700;}
.ms-miss{padding:26px 18px;font-size:13px;color:#8a5b2b;background:#fdf6e8;border-radius:8px;line-height:1.7;}

body{margin:0;font-family:var(--ms-sans);background:#eef2f6;color:#1f2c3a;font-size:14px;}
.pg-top{background:linear-gradient(120deg,var(--ms-navy),#2c5282);color:#fff;padding:20px 28px;}
.pg-top h1{margin:0;font-size:22px;font-weight:700;letter-spacing:.5px;}
.pg-top h1 .en{font-weight:400;opacity:.85;font-size:15px;margin-left:10px;}
.pg-top .sub{opacity:.82;font-size:13px;margin-top:5px;}
.pg-box{max-width:1760px;margin:16px auto;}
.pg-box .ms-shell{box-shadow:0 6px 22px rgba(20,40,70,.10);}
</style>
</head>

  <div class="ms-tb2">

  <div class="ms-gbox" id="ms-gbox">

        </tr></thead>
        <tbody id="ms-tb"></tbody>
      </table>
    </div>
  </div>
</div></div>

{"zh": "施工階段", "color": "#2C8C99"}, {"zh": "前期工作階段", "color": "#6B7C8C"}], "src": "20260817 Master Schedule.xlsx", "src_date": "2026-08-17"};
const LEFT_W = 132 + 46 + 336 + 162;         /* must match --ms-w-* vars */
const MON_EN = ['','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DENS = {s:[34,18],m:[44,24],l:[56,32]};
let ppd = 3.4, key = 'detail', showRem = false;

const $ = id => document.getElementById(id);
function tasks(){ return D[key]; }
function tlw(){ return Math.round(D.total * ppd); }
function dayOf(s){ return (new Date(s) - new Date(D.start)) / 86400000; }
function xOf(s){ return dayOf(s) * ppd; }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
  .replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function tattr(s){ return esc(s).replace(/\n/g,'&#10;'); }

/* ---------- axis (year + month header) ---------- */
function renderAxis(){
  const W = tlw();
  let yr='', mo='', cur=null, acc=0;
  D.months.forEach(m=>{
    const w = m.days * ppd;
    if(m.y !== cur){
      if(cur!==null) yr += `<div class="ms-yc" style="width:${acc}px">${cur}年</div>`;
      cur = m.y; acc = 0;
    }
    acc += w;
    let lab='';
    if(w>=72) lab = `${m.m}月 ${MON_EN[m.m]}`;
    else if(w>=34) lab = `${m.m}月`;
    else if(w>=15) lab = `${m.m}`;
    mo += `<div class="ms-mc" style="width:${w}px">${lab}</div>`;
  });
  if(cur!==null) yr += `<div class="ms-yc" style="width:${acc}px">${cur}年</div>`;
  $('ms-yrow').innerHTML = yr;
  $('ms-mrow').innerHTML = mo;
  $('ms-ax').style.width = W + 'px';
  $('ms-todaytick').style.left = xOf(D.today) + 'px';
}

/* ---------- rows ---------- */
function renderBody(){
  const rows = tasks();
  let h='';
  rows.forEach((t,i)=>{
    h += `<tr id="ms-r-${key}-${i}">`;
    if(t.gspan>0){
      h += `<td class="ms-c-ph" rowspan="${t.gspan}" style="background:${t.color}">`
        +  `<div class="ms-pz">${esc(t.phase)}</div>`
        +  (t.phaseEn ? `<div class="ms-pe">${esc(t.phaseEn)}</div>` : '')
        +  `</td>`;
    }
    h += `<td class="ms-c-seq">${esc(t.seq)}</td>`;
    h += `<td class="ms-c-wk"><div class="ms-wz" title="${tattr(t.work)}">${esc(t.work)}</div>`
      +  (t.workEn ? `<div class="ms-we" title="${tattr(t.workEn)}">${esc(t.workEn)}</div>` : '')
      +  (showRem && (t.rem||t.remEn)
            ? `<div class="ms-wr">${esc(t.rem)}${t.remEn ? ' / '+esc(t.remEn) : ''}</div>` : '')
      +  `</td>`;
    h += `<td class="ms-c-dt"><div class="ms-dd">${esc(t.sd)}</div>`
      +  `<div class="ms-de">&rarr; ${esc(t.ed)}${t.dur ? ' · '+esc(t.dur)+'d' : ''}</div></td>`;
    let bar='';
    if(t.sd && t.ed){
      const l = xOf(t.sd);
      const w = Math.max(xOf(t.ed) - l + ppd, 4);
      const tip = `${t.work}${t.workEn ? ' / '+t.workEn : ''}\n`
        + `階段 Phase: ${t.phase}${t.phaseEn ? ' / '+t.phaseEn : ''}\n`
        + `${t.sd} → ${t.ed}${t.dur ? '  ('+t.dur+' 曆日 / calendar days)' : ''}`
        + (t.rem ? `\n備註: ${t.rem}` : '') + (t.remEn ? `\nRemarks: ${t.remEn}` : '');
      bar = `<div class="ms-bar" style="left:${l}px;width:${w}px;background:${t.color}"`
        + ` title="${tattr(tip)}">`
        + ((w>=38 && t.dur) ? `<span class="ms-bl">${esc(t.dur)}d</span>` : '')
        + `</div>`;
    }
    h += `<td class="ms-c-tl">${bar}</td></tr>`;
  });
  $('ms-tb').innerHTML = h;
}

/* ---------- overlay: month bands, grid lines, today ---------- */
function layout(){
  const W = tlw();
  $('ms-cTl').style.width = W + 'px';
  $('ms-gt').style.width = (LEFT_W + W) + 'px';
  const th = document.querySelector('#ms-gt thead');
  const tb = $('ms-tb');
  const ov = $('ms-overlay');
  ov.style.left = LEFT_W + 'px';
  ov.style.top = th.offsetHeight + 'px';
  ov.style.width = W + 'px';
  ov.style.height = tb.offsetHeight + 'px';
  let s='';
  D.months.forEach((m,i)=>{
    const x = m.off * ppd, w = m.days * ppd;
    if(i % 2 === 1) s += `<div class="ms-mb" style="left:${x}px;width:${w}px"></div>`;
    s += `<div class="${m.m===1 ? 'ms-yl' : 'ms-ml'}" style="left:${x}px"></div>`;
  });
  s += `<div class="ms-tdl" style="left:${xOf(D.today)}px"><span>今日 TODAY ${D.today}</span></div>`;
  ov.innerHTML = s;
  $('ms-zlbl').textContent = Math.round(ppd*30.44) + ' px/月';
}

/* ---------- legend (current view's phase groups, clickable) ---------- */
function renderLegend(){
  let h='';
  tasks().forEach((t,i)=>{
    if(t.gspan>0){
      h += `<span class="ms-lg" onclick="MS.locate(${i})" title="${tattr(t.phase+(t.phaseEn?' / '+t.phaseEn:''))}">`
        +  `<span class="ms-sw" style="background:${t.color}"></span>`
        +  `<span class="ms-pn">${esc(t.phase)}</span>`
        +  (t.phaseEn ? `<span class="ms-pen">${esc(t.phaseEn)}</span>` : '')
        +  `<span class="ms-n">${t.gspan}</span></span>`;
    }
  });
  $('ms-legend').innerHTML = h;
}

function draw(){ renderAxis(); renderBody(); renderLegend(); layout(); }

/* ---------- controls ---------- */
function switchView(v){
  key = v;
  $('ms-t-detail').classList.toggle('on', v==='detail');
  $('ms-t-main').classList.toggle('on', v==='main');
  draw();
}
function zoom(f){
  const box = $('ms-gbox');
  const vis = Math.max(0, box.clientWidth - LEFT_W);
  const day = (box.scrollLeft + vis/2) / ppd;                 /* keep centre */
  ppd = Math.min(24, Math.max(0.35, ppd * f));
  draw();
  box.scrollLeft = Math.max(0, day * ppd - vis/2);
}
function setPpd(v){ ppd = Math.min(24, Math.max(0.35, v)); draw(); }
function preset(p){
  if(p==='week')    setPpd(9.5);
  if(p==='month')   setPpd(4.6);
  if(p==='quarter') setPpd(2.2);
  goToday();
}
function fit(){
  const box = $('ms-gbox');
  setPpd(Math.max(0.35, (box.clientWidth - LEFT_W - 6) / D.total));
  box.scrollLeft = 0;
}
function goToday(){
  const box = $('ms-gbox');
  box.scrollLeft = Math.max(0, LEFT_W + xOf(D.today) - box.clientWidth/2);
}
function goEdge(e){
  const box = $('ms-gbox');
  box.scrollLeft = e ? box.scrollWidth : 0;
}
function dens(k){
  ['s','m','l'].forEach(x=>$('ms-d-'+x).classList.toggle('on', x===k));
  document.documentElement.style.setProperty('--ms-rh', DENS[k][0]+'px');
  document.documentElement.style.setProperty('--ms-bh', DENS[k][1]+'px');
  layout();
}
function toggleRem(){
  showRem = !showRem;
  $('ms-b-rem').classList.toggle('on', showRem);
  $('ms-gt').classList.toggle('ms-rem', showRem);
  renderBody(); layout();
}
function fullscreen(){
  const w = $('ms-shell');
  if(document.fullscreenElement) document.exitFullscreen();
  else if(w.requestFullscreen) w.requestFullscreen();
}
function locate(i){
  const row = $(`ms-r-${key}-${i}`);
  if(!row) return;
  const box = $('ms-gbox');
  box.scrollTop = Math.max(0, row.offsetTop - box.clientHeight/2);
  const t = tasks()[i];
  if(t && t.sd) box.scrollLeft = Math.max(0, LEFT_W + xOf(t.sd) - box.clientWidth/2);
  const span = (t && t.gspan) ? t.gspan : 1;
  for(let k2=i;k2<i+span;k2++){
    const r = $(`ms-r-${key}-${k2}`);
    if(r){ r.classList.add('ms-flash'); setTimeout(()=>r.classList.remove('ms-flash'), 1400); }
  }
}
/* Re-measure after the panel becomes visible (hidden panels measure 0). */
function refresh(){ draw(); goToday(); }

/* ctrl / cmd + wheel = zoom */
$('ms-gbox').addEventListener('wheel', e=>{
  if(e.ctrlKey || e.metaKey){ e.preventDefault(); zoom(e.deltaY < 0 ? 1.12 : 1/1.12); }
}, {passive:false});
window.addEventListener('resize', layout);

window.MS = {switchView, zoom, setPpd, preset, fit, goToday, goEdge, dens, toggleRem,
             fullscreen, locate, refresh, draw, layout,
             get ppd(){ return ppd; }, get view(){ return key; }, data:D};

draw();
goToday();
$('ms-upd').innerHTML = D.src_date ? `Updated: <b>${esc(D.src_date)}</b>` : '';
})();
</script>
